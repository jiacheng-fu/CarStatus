<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarStatus</title>
<style>
  :root { --bg:#0b0d10; --card:#14171c; --line:#232831; --ink:#eef1f5; --dim:#8a93a3; --fuel:#f5b445; --batt:#4fd1a5; --accent:#6ea8ff; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 80% at 20% 0%, #18202c 0%, var(--bg) 60%); color: var(--ink);
         font: 15px/1.4 ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: min(760px, 92vw); background: linear-gradient(180deg, #171b21, var(--card)); border: 1px solid var(--line); border-radius: 22px; padding: 34px 38px 28px;
          box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--batt); box-shadow: 0 0 12px var(--batt); }
  .badge { font: 600 11px/1 ui-monospace, "SF Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
           border: 1px solid rgba(110,168,255,.35); border-radius: 999px; padding: 7px 11px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.01em; margin: 26px 0 4px; }
  .sub { color: var(--dim); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; margin-top: 28px; }
  .tile { background: #101317; border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px; min-height: 168px; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font: 600 11px/1 ui-monospace, "SF Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .big small { font-size: 16px; color: var(--dim); font-weight: 600; margin-left: 6px; letter-spacing: 0; }
  .gauge { position: relative; width: 112px; height: 112px; align-self: center; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .v { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gauge circle { fill: none; stroke-width: 10; }
  .track { stroke: #1e232b; }
  .arc { stroke-linecap: round; transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1); }
  .na { color: var(--dim); font-size: 14px; align-self: center; }
  footer { display: flex; justify-content: space-between; margin-top: 22px; color: var(--dim); font-size: 13px; }
  footer code { font: 12px ui-monospace, "SF Mono", monospace; color: #b8c0cc; }
  .pulse { animation: pulse 1.2s ease-in-out; }
  @keyframes pulse { 0% { opacity: .35 } 100% { opacity: 1 } }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <header>
    <span class="brand"><i></i>CarStatus</span>
    <span class="badge" id="mode">connecting…</span>
  </header>
  <h1 id="name">—</h1>
  <p class="sub" id="meta">Reading your car through Smartcar…</p>
  <section class="grid">
    <div class="tile"><span class="label">Odometer</span><span class="big" id="odo">—</span></div>
    <div class="tile"><span class="label">Fuel</span><div id="fuel"></div></div>
    <div class="tile"><span class="label">Battery</span><div id="batt"></div></div>
  </section>
  <footer><span id="updated">—</span><code>npm run web · same data as the CLI</code></footer>
</main>
<script>
  const R = 46, C = 2 * Math.PI * R;
  const gauge = (pct, color) => pct == null ? '<p class="na">not reported</p>' :
    `<div class="gauge"><svg width="112" height="112"><circle class="track" cx="56" cy="56" r="${R}"/>` +
    `<circle class="arc" cx="56" cy="56" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg>` +
    `<span class="v">${Math.round(pct)}%</span></div>`;
  /* Gauges are built once and then only their arc moves, so a new reading
     sweeps from the old value instead of redrawing (and the first one sweeps
     up from empty). */
  function setGauge(id, pct, color) {
    const host = document.getElementById(id);
    if (pct == null) { host.innerHTML = gauge(null); return; }
    if (!host.querySelector('.arc')) {
      host.innerHTML = gauge(0, color);
      host.querySelector('.arc').getBoundingClientRect();
    }
    requestAnimationFrame(() => {
      host.querySelector('.arc').style.strokeDashoffset = C * (1 - pct / 100);
      host.querySelector('.v').textContent = `${Math.round(pct)}%`;
    });
  }
  const every = Math.max(1, Number(new URLSearchParams(location.search).get('every')) || 10);
  let last = 0;
  async function load() {
    try {
      const r = await fetch('/api/status'); const s = await r.json();
      if (!r.ok) throw new Error(s.error || r.statusText);
      document.getElementById('mode').textContent = s.mode === 'live' ? 'live vehicle · smartcar' : 'simulated vehicle · smartcar';
      document.getElementById('name').textContent = s.name;
      const car = [s.year, s.make, s.model].filter(Boolean).join(' ');
      document.getElementById('meta').textContent = car + (s.powertrain && s.powertrain !== s.model ? ` · ${s.powertrain}` : '');
      const odo = document.getElementById('odo');
      odo.innerHTML = s.odometer == null ? '<span class="na">not reported</span>' : `${Math.round(s.odometer).toLocaleString()}<small>${s.odometerUnit}</small>`;
      odo.classList.remove('pulse'); void odo.offsetWidth; odo.classList.add('pulse');
      setGauge('fuel', s.fuel, 'var(--fuel)');
      setGauge('batt', s.battery, 'var(--batt)');
      last = Date.now();
    } catch (e) {
      document.getElementById('meta').textContent = 'Could not reach the car: ' + e.message;
    }
  }
  setInterval(() => { if (last) document.getElementById('updated').textContent = `Updated ${Math.round((Date.now() - last) / 1000)}s ago · refreshes every ${every}s`; }, 500);
  load(); setInterval(load, every * 1000);
</script>
</body>
</html>
